<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cyberjapandata.gsi.go.jp https://www.jma.go.jp; connect-src 'self' wss://ws-api.wolfx.jp wss://api.p2pquake.net https://api.open-meteo.com">
  <title>Topmost Clock</title>
  <link rel="stylesheet" href="../../node_modules/leaflet/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="frame">
    <header id="bar">
      <nav id="tabs"></nav>
      <div id="alert-banner" hidden></div>
      <div class="spacer"></div>
      <div id="warn-chip" hidden></div>
      <div id="date"></div>
      <div id="clock-mini"><span id="mini-h"></span><span class="colon">:</span><span id="mini-m"></span><span class="s" id="mini-s"></span></div>
      <div id="controls">
        <button id="btn-top" title="常に手前に表示">TOP</button>
        <button id="btn-settings" title="設定 (ページの表示時間など)">⚙ 設定</button>
        <button id="btn-mute" title="音のオン/オフ">♪</button>
        <input id="opacity" type="range" min="30" max="100" value="100" title="不透明度">
      </div>
      <div id="progress"></div>
    </header>

    <main id="pages">
      <!-- 時計 -->
      <section class="page" data-page="clock" data-label="時計">
        <div id="clock-face">
          <div id="clock-time" class="rv"><span id="c-hm"><span id="c-h">--</span><span class="colon">:</span><span id="c-m">--</span></span><span id="c-sec">--</span></div>
          <div id="clock-minute" class="rv"><div id="c-minute-bar"></div></div>
          <div id="clock-date" class="rv"></div>
          <div id="clock-info" class="rv"></div>
        </div>
      </section>

      <!-- 天気 -->
      <section class="page" data-page="weather" data-label="天気">
        <div class="card weather">
          <div class="card-title">WEATHER <span id="w-city"></span></div>
          <div id="w-now" class="rv">
            <div id="w-icon"></div>
            <div>
              <div id="w-temp">--</div>
              <div id="w-cond">読み込み中...</div>
            </div>
            <div id="w-meta"></div>
          </div>
          <div id="w-warn" class="rv"></div>
          <div id="w-hours"></div>
          <div id="w-updated" class="muted small"></div>
        </div>
      </section>

      <!-- 雨雲レーダー -->
      <section class="page" data-page="radar" data-label="雨雲">
        <div id="radar-map" class="map"></div>
        <div id="radar-hud" class="rv">
          <div class="card-title">RAIN RADAR</div>
          <div id="radar-time">--:--</div>
          <div id="radar-kind"></div>
        </div>
        <div id="radar-timeline" class="rv">
          <button id="radar-play" title="再生/停止">❚❚</button>
          <input id="radar-slider" type="range" min="0" max="0" value="0">
          <div id="radar-legend"></div>
        </div>
      </section>

      <!-- システム -->
      <section class="page" data-page="status" data-label="PC">
        <div class="card status">
          <div class="card-title">SYSTEM STATUS</div>
          <div id="status-grid"></div>
        </div>
      </section>

      <!-- 地震 -->
      <section class="page" data-page="quake" data-label="地震">
        <div id="quake-map" class="map"></div>
        <div id="quake-panel"></div>
        <button id="quake-dismiss" hidden title="通常表示に戻る">通常表示に戻る</button>
      </section>
    </main>
  </div>

  <script src="../../node_modules/leaflet/dist/leaflet.js"></script>
  <script src="common.js"></script>
  <script src="clock.js"></script>
  <script src="weather.js"></script>
  <script src="radar.js"></script>
  <script src="status.js"></script>
  <script src="warnings.js"></script>
  <script src="quake.js"></script>
  <script src="app.js"></script>
</body>
</html>
